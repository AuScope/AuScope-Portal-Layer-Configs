name: restart-dev-api

on:
  push:
    branches:
      - AuScopePortalDev

permissions:
  id-token: write
  contents: read
  packages: write

jobs:

  push:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI script
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -e

            az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            echo "Restarting container app: ${{ secrets.AZURE_DEVCONTAINERNAME }}"

            az containerapp revision restart --name ${{ secrets.AZURE_DEVCONTAINERNAME }} --resource-group ${{ secrets.AZURE_DEVRG }}
