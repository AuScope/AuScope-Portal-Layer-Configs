name: YAML Validation

on:
  pull_request:
    branches:
      - AuScopePortalProd
  
  push:
    branches:
      - '**'
      - '!AuScopePortalProd'

jobs:
  validate-yaml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install YAML validation tools
        run: pip install yamllint yamale

      - name: Lint YAML files
        run: yamllint -c .yamllint.yaml .

      - name: Validate layers.yaml against schema
        run: yamale layers.yaml -s layers_schema.yaml
