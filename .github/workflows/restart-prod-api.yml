name: restart-prod-api

on:
  push:
    branches:
      - AuScopePortalProd

permissions:
  id-token: write
  contents: read
  packages: write

jobs:

  restart:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restart Production Container App
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -e

            az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            echo "Restarting PROD container app: ${{ secrets.AZURE_PRODCONTAINERNAME }}"

            az containerapp revision restart --name ${{ secrets.AZURE_PRODCONTAINERNAME }} --resource-group ${{ secrets.AZURE_PRODRG }}
